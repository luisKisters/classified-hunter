[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kleinscoutr"
version = "0.1.0"
description = "Profile-driven classified listing hunts"
requires-python = ">=3.11"
dependencies = []
license = "LicenseRef-BSL-1.1"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]

[project.scripts]
kleinscoutr = "kleinscoutr.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
